<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon.svg">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Core-Analyzer">
	<meta name="theme-color" content="#0a0a0a">

    <title>Core-Analyzer | Precise Storm Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="map-container">
        <iframe id="windy-frame" src="https://embed.windy.com/embed2.html?lat=13.7&lon=100.5&zoom=5&level=surface&overlay=wind&product=ecmwf" frameborder="0"></iframe>
    </div>

    <div id="core-analyzer-box">
        <div class="analyzer-status">📡 AI CORE: MONITORING (5-YEAR PROJECT)</div>
        <div id="scan-display"></div>
    </div>

    <aside id="control-panel">
        <h3>Command Center</h3>
        <div class="control-item">
            <label>Transparency</label>
            <input type="range" id="opacity-ctrl" min="10" max="100" value="92">
        </div>
        <button class="btn-scan" onclick="manualScan()">Process Layers</button>
        <button class="btn-export" onclick="exportBrandedReport()">📊 Branded Export</button>
        
        <div class="control-item" style="border-top: 1px solid #444; margin-top: 15px; padding-top: 10px;">
            <label>Subscribe Feed</label>
            <div style="display: flex; gap: 5px;">
                <a href="/feed/rss" class="btn-feed rss">RSS</a>
                <a href="/feed/atom" class="btn-feed atom">Atom</a>
            </div>
        </div>
        <div class="log-container" id="event-log">> Initializing...</div>
    </aside>

    <div id="branding-capture" style="position: fixed; top: -3000px; width: 1200px; background: white; padding: 40px;">
        <div style="display: flex; align-items: center; border-bottom: 5px solid #0078ff; padding-bottom: 20px;">
            <img src="myicon.png" style="width: 100px; height: 100px;">
            <div style="margin-left: 25px;">
                <h1 style="margin: 0; font-size: 32px;">CORE-ANALYZER ANALYTICS</h1>
                <p style="margin: 0; color: #666;">Storm Signature & Air Quality Tracking System</p>
            </div>
        </div>
        <div id="snapshot-body" style="margin-top: 25px;"></div>
        <p style="text-align: right; color: #888;">Analyst: Charaswat AI | Date: <span id="snapshot-date"></span></p>
    </div>
	<button id="captureBtn" class="capture-btn">📸</button>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
